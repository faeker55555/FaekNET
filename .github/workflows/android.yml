name: Android APK

on:
  push:
    branches: [main, arena/01a08a07-faeknet]
    tags: ['v*']
    paths: ['android/**']
  pull_request:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # android-actions/setup-android@v3 no longer works against the current
      # ubuntu-latest runner image: it shells out to sdkmanager and dies with
      # "Failed to find package 'tools'" (exit 1), failing the job before
      # gradle ever runs. The image already has the Android SDK installed, so
      # set it up directly, and pick whichever cmdline-tools revision is
      # present rather than assuming a `latest` symlink exists.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          cmdline="$(find "$SDK/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$cmdline"
          echo "using $cmdline"
          echo "$cmdline/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$cmdline/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: faeknet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
