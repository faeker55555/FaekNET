# Temporary diagnostic workflow (removed once the real CI is green):
# runs `cargo test --workspace --locked` and dumps the full output into
# the job step summary, which is readable from the GitHub API even from
# environments that cannot reach the actions log host.
name: CI Debug (temp)

on:
  push:
    branches: [arena/01a0222a-faeknet]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: never

jobs:
  debug-build:
    name: Debug build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests (capture output)
        id: tests
        continue-on-error: true
        run: |
          cargo test --workspace --locked 2>&1 | tee /tmp/cargo-test.log || true

      - name: Write summary
        run: |
          {
            echo '## cargo test --workspace --locked'
            echo '```'
            tail -n 250 /tmp/cargo-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
